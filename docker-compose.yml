
services:
  # -------------------------
  # Node.js Backend (Node 18)
  # -------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    restart: always
    working_dir: /app
    environment:
      PORT: 5000
      # Replace with your MongoDB Atlas connection string
      DB_URI: ${DB_URI}
    ports:
      - "5000:5000"
    depends_on:
      - frontend

  # -------------------------
  # React Frontend (Node 18 build + Nginx)
  # -------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    restart: always
    ports:
      - "3000:80"   # Nginx serves on port 80 internally
    depends_on:
      - backend