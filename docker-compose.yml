
services:
  # -------------------------
  # Node.js Backend (Node 18)
  # -------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    restart: always
    working_dir: /app
    environment:
      PORT: 5000
      # Replace with your MongoDB Atlas connection string
      MONGO_URI: mongodb+srv://donblezzy:Myschool12345@shopit.z1pjnwt.mongodb.net/ShopIT?retryWrites=true&w=majority&appName=ShopIT
    ports:
      - "5000:5000"
    networks:
      - app-network

  # -------------------------
  # React Frontend (Node 18 build + Nginx)
  # -------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    restart: always
    ports:
      - "3000:80"   # Nginx serves on port 80 internally
    depends_on:
      - backend
    networks:
      - app-network

# -------------------------
# Internal network
# -------------------------
networks:
  app-network:
    driver: bridge
